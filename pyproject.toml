[project]
name = "sessioniq"
version = "0.1.0"
description = "Source-grounded AI intelligence platform for audio, MIDI, and production notes."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "librosa>=0.10.2",
    "mido>=1.3.2",
    "numpy>=1.26.0",
    "openai>=1.40.0",
    "pretty_midi>=0.2.10",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "soundfile>=0.12.1",
    "streamlit>=1.36.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]
vector = [
    "chromadb>=0.5.0",
]
voice = [
    "faster-whisper>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
