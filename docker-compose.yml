services:
  sessioniq:
    build: .
    ports:
      - "8080:8000"
    restart: unless-stopped
    # The image ships a generated demo library, so the container serves a
    # populated dashboard in seconds. Uncomment the volume for uploads that
    # survive a restart — the first boot on an empty volume regenerates the
    # demo content and takes about a minute.
    # volumes:
    #   - sessioniq-data:/app/.sessioniq-data
    # environment:
    #   SESSIONIQ_SEED_DEMO: "1"

# volumes:
#   sessioniq-data:
