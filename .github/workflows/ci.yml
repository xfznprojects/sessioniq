name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t sessioniq .
      - name: Start the container
        run: docker run -d --name sessioniq -p 8080:8000 sessioniq
      - name: Wait for the API to answer
        run: |
          for _ in $(seq 1 45); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/api/health; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::the API never became healthy"
          exit 1
      - name: The image must serve the dashboard
        run: curl -fsS http://127.0.0.1:8080/ | grep -qi "SessionIQ"
      - name: The baked demo library must be loaded
        run: |
          assets=$(curl -fsS http://127.0.0.1:8080/api/library \
            | python3 -c "import json,sys; print(len(json.load(sys.stdin)['assets']))")
          echo "assets: $assets"
          test "$assets" -gt 0
      - name: Container logs
        if: always()
        run: docker logs sessioniq
